domain: refund_cancellation
version: 0.1.0
status: seed
intents:
  - intent_id: s1_refund_policy_reversal
    risk_domain: refund_cancellation
    failure_pattern: refund_rule_reversal
    business_risk: AI says a refund is available when the applicable policy would require review or deny the refund.
    severity_default: S1
    question_templates:
      - "If a user cancels after starting a paid contract, can they receive a refund?"
      - "A customer says they were told refunds are possible after use starts. How should the assistant respond?"
    expected_behavior_type: conditional_policy_answer_with_human_review
    prohibited_behavior:
      - State that a refund is available without checking the applicable refund policy.
      - Create an exception not present in the approved source.
      - Treat historical refund handling as current policy.
    evidence_requirements:
      - refund_policy
      - contract_terms
      - exception_policy
    recommended_eval_mode: evidence_keyword
    human_review_required_fields:
      - source_document_id
      - policy_effective_date
      - expected_answer_review_status
      - escalation_owner
    block_reason_template: "Refund answer may reverse the applicable refund rule or skip required human review."
    notes_markers:
      - "intent:s1_refund_policy_reversal"
      - "pattern:refund_rule_reversal"
      - "design:risk_based"
      - "release:block"
    status: seed
    version: 0.1.0

  - intent_id: s1_cancellation_fee_omission
    risk_domain: refund_cancellation
    failure_pattern: fee_or_penalty_omission
    business_risk: AI omits cancellation fees, minimum terms, or required confirmation steps that affect customer handling.
    severity_default: S1
    question_templates:
      - "Can a customer cancel immediately without any additional fees?"
      - "What should the assistant say when cancellation may involve a minimum term or fee?"
    expected_behavior_type: fee_condition_disclosure_with_escalation
    prohibited_behavior:
      - Say cancellation is always free.
      - Omit minimum term or fee conditions when the source requires them.
      - Advise the user to cancel without mentioning required confirmation.
    evidence_requirements:
      - cancellation_policy
      - fee_schedule
      - contract_terms
    recommended_eval_mode: evidence_keyword
    human_review_required_fields:
      - source_document_id
      - fee_condition_reference
      - expected_answer_review_status
      - escalation_owner
    block_reason_template: "Cancellation answer may omit fee, minimum term, or confirmation requirements."
    notes_markers:
      - "intent:s1_cancellation_fee_omission"
      - "pattern:fee_or_penalty_omission"
      - "design:decision_table"
      - "release:block"
    status: seed
    version: 0.1.0

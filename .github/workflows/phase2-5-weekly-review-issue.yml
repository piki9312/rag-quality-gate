name: Phase2.5 Weekly Ops Review Issue (Manual/Backfill)

on:
  workflow_dispatch:
    inputs:
      week_start_override:
        description: "Optional week_start override (YYYY-MM-DD) for backfill"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-weekly-review-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create or reuse weekly review issue
        id: weekly_review_issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let weekStart = `${{ github.event.inputs.week_start_override || '' }}`.trim();
            if (!weekStart) {
              const now = new Date();
              const weekday = now.getUTCDay();
              const diffToMonday = (weekday + 6) % 7;
              const weekStartDate = new Date(
                Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - diffToMonday)
              );
              weekStart = weekStartDate.toISOString().slice(0, 10);
            }
            const title = `[Phase2.5][Weekly Review] ${weekStart}`;

            const query = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q: query });
            const matchingIssues = existing.data.items
              .filter((item) => !item.pull_request)
              .sort(
                (a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
              );
            if (matchingIssues.length > 0) {
              const selectedIssue = matchingIssues[0];
              if (matchingIssues.length > 1) {
                core.info(
                  `Multiple weekly review issues found (${matchingIssues.length}); ` +
                  `selected latest created_at: ${selectedIssue.html_url}`
                );
              }
              core.setOutput('issue_number', String(selectedIssue.number));
              core.setOutput('issue_url', selectedIssue.html_url);
              core.setOutput('week_start', weekStart);
              core.info(`Existing weekly review issue found: ${selectedIssue.html_url}`);
              return selectedIssue.html_url;
            }

            const body = [
              `Week start: ${weekStart}`,
              '',
              '## Weekly Ops Checklist',
              '- [ ] Phase2.5 weekly metrics summary reviewed',
              '- [ ] investigate issue open/close status reviewed',
              '- [ ] failure_category to action quality reviewed',
              '- [ ] override / warn-only / no-data exceptions reviewed',
              '- [ ] case quality weekly review completed',
              '- [ ] onboarding / weekly ops measured values validated',
              '',
              '## Automation Updates',
              '- Weekly metrics workflow posts next_actions and a non-technical weekly summary as a comment.',
              '',
              '## Related Files',
              '- docs/ops/operations/phase2-5-weekly-metrics-register.md',
              '- docs/ops/operations/phase2-5-investigate-response-flow.md',
              '- docs/ops/operations/phase2-5-ws2-failure-review-template.md',
              '- docs/ops/operations/phase2-5-ws3-gate-exception-approval-template.md',
              '- docs/ops/operations/phase2-5-case-quality-weekly-review.md',
            ].join('\n');

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });
            core.setOutput('issue_number', String(created.data.number));
            core.setOutput('issue_url', created.data.html_url);
            core.setOutput('week_start', weekStart);
            core.info(`Created weekly review issue: ${created.data.html_url}`);
            return created.data.html_url;

      - name: Print weekly review issue URL
        run: |
          echo "weekly_review_issue_url=${{ steps.weekly_review_issue.outputs.result }}"
          echo "weekly_review_issue_number=${{ steps.weekly_review_issue.outputs.issue_number }}"
          echo "week_start=${{ steps.weekly_review_issue.outputs.week_start }}"

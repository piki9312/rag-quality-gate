pack:
  name: internal-s1-release-gate-demo
  version: "1.0"
  pack_name: internal-s1-release-gate-demo
  pack_version: "1.0"
  tenant_name: internal-demo
  use_case: internal-release-gate-demo
  vertical: customer-support
  risk_profile: high
  owner: proofgate-demo-owner
  environment: demo
  source_pack: demo_internal
  domain: "Internal Demo"
  profile: "S1 Release Gate"
  review_steward: proofgate-demo-owner
  description: >
    Minimal internal demo that shows Proof Gate blocking S1 major-answer failures
    before release.

cases_file: casegen/cases.csv
documents_dir: documents
gate_file: gate.yml

severity_policy:
  s1_definition:
    - human-authored safety gate cases that stop release on major-answer failures
    - active S1 rows should include reviewed expected_answer and expected_evidence
    - active S1 rows should include owner and last_reviewed_at
    - active S1 rows should include the manual_review_required note marker
    - active S1 rows should include a failure pattern reference and block reason
  s2_definition:
    - broader quality coverage cases that may be assisted by generation

common_failure_patterns:
  - name: keyword_miss
    symptom: "Answer does not match the approved S1 answer"
    first_action: "Review the source policy, prompt behavior, and approved expected_answer"
  - name: retrieval_miss
    symptom: "Expected evidence was not retrieved for the S1 case"
    first_action: "Review chunking, indexing, and expected_evidence alignment"

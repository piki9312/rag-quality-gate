# Internal Documents Quality Pack (HR Profile)
pack:
  name: internal-docs-hr-profile
  version: "1.1"
  domain: "Internal Documents"
  profile: "HR/Policy"
  review_steward: hr-team
  description: >
    社内文書を知識源にする業務支援 AI の品質ゲート向けパック。
    このプロファイルは人事・就業規則・経費関連の文書で最初の導入価値を示す。

cases_file: cases.csv
documents_dir: documents
gate_file: gate.yml

severity_policy:
  s1_definition:
    - 法令・規程違反リスクにつながる誤回答
    - 期限や金額上限などの重大誤案内
    - 権利・資格・懲戒など重大判断の誤案内
  s2_definition:
    - 補足情報不足
    - 手順説明の粒度不足
    - 非重大な説明品質劣化

# KPI 定義
kpis:
  keyword_match_rate:
    description: "回答にドメイン固有キーワードが含まれる割合"
    target: 0.80
    weight: 0.35
  retrieval_hit_rate:
    description: "期待根拠が検索結果に含まれる割合"
    target: 0.85
    weight: 0.25
  reference_accuracy:
    description: "回答の参照根拠が retrieval 結果と整合する割合"
    target: 0.90
    weight: 0.20
  s1_pass_rate:
    description: "重大ケース (S1) の合格率"
    target: 1.00
    weight: 0.20

# SLO (Gate 判断で使う)
slo:
  s1_pass_rate: 1.00
  overall_pass_rate: 0.85
  retrieval_precision_min: 0.70
  regression_tolerance: 0.05

weekly_review_focus:
  - impacted_case_count の急増/急減
  - S1 fail の有無と改善 owner/due の設定
  - last_reviewed_at 基準で stale case の抽出
  - investigate issue の未解決件数
  - failure_action_coverage_rate の維持

common_failure_patterns:
  - name: retrieval_miss
    symptom: "期待根拠が top-k に現れない"
    first_action: "chunking/retrieval 設定と expected_chunks を再確認"
  - name: stale_case_definition
    symptom: "文書更新後に expected_keywords が古い"
    first_action: "cases.csv を更新し last_reviewed_at を当日に更新"
  - name: procedure_drift
    symptom: "手順変更がケースに反映されていない"
    first_action: "影響ケースを追加し review 出力で差分確認"
  - name: escalation_gap
    symptom: "fail 後の担当と期限が未設定"
    first_action: "weekly review issue で owner/due を必須入力"
  - name: synthesis
    symptom: "検索は成功したがキーワード一致率や参照精度が低い"
    first_action: "JSONL で対象ケースの answer を確認し expected_keywords を見直す"
  - name: tool_failure
    symptom: "API タイムアウト・rate limit 等でエラー終了"
    first_action: "API ステータスとリトライ設定を確認し再実行する"
  - name: unknown
    symptom: "既知パターンに分類できない失敗"
    first_action: "JSONL の failure_type と failure_reason を確認し分類ルールの追加を検討"

# ROI サマリ
roi:
  # ── ケースポートフォリオ ──────────────────────────────
  case_portfolio:
    total_cases: 17
    s1_critical: 7          # 法令・重大誤案内リスク
    s2_standard: 10

  # ── Before（自動ゲート導入前）───────────────────────────
  before:
    review_method: "担当者による手動確認"
    estimated_time_per_case_min: 15   # 回答確認・根拠照合の目安
    estimated_total_review_min: 255   # 17 cases × 15 min
    s1_detection: "目視確認のみ。ケース増加・担当者変更で見落としリスクあり"
    frequency: "随時または文書更新後に任意実施（定例化されていない）"

  # ── After（rqg 導入後）──────────────────────────────────
  after:
    review_method: "rqg eval + rqg check の自動ゲート"
    gate_run_estimate_min: 15         # 17 ケース × LLM judge（目安）
    time_to_detection: "初回実行で即検出（detect-in-1-run）"
    s1_enforcement: "100% 強制（SLO: s1_pass_rate=1.00、未達でブロック）"
    frequency: "文書更新のたびに CI/CD または定例 cron で実行"

  # ── デモ実行から得られた観測値 ───────────────────────────
  observed_demo_metrics:
    fail_fix_cycles_tested: 3
    convergence_success: "3/3 (100%) — 全サイクルで修正後に pass"
    fail_detected_in_run: 1          # 壊した時点の最初の run で検出
    s1_fail_blocked: true            # S1 fail は gate が自動ブロック
    latency_tracked: true            # JSONL に latency_ms を記録済み
    note: "demo_runs は 1-case サンプル。実業務規模のデータは 4 週間運用後に更新予定。"

  # ── 推定工数削減 ─────────────────────────────────────────
  estimated_savings:
    time_saved_per_cycle_min: 240    # 255 (手動) − 15 (自動) ≈ 240 min/回
    s1_leakage_risk_reduction: "ゲートなしに比べ実質ゼロへ"
    impact_scope_auto: "文書変更ごとに影響ケースを自動特定（rqg impact）"
    release_decision_speed: "pass/fail が数値根拠つきで即時出力"
    assumptions: "手動確認 15 min/case は小規模チーム実績に基づく推定値"

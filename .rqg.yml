# .rqg.yml — Example gate configuration
thresholds:
  s1_pass_rate: 100.0
  overall_pass_rate: 80.0
  retrieval_precision: 70.0
  max_latency_p95_ms: 5000
  max_cost_per_query_usd: 0.05

  # Warn thresholds (optional).  When a metric passes the fail threshold
  # above but falls below the warn threshold, the gate status becomes
  # "warn" instead of "pass".  Warn does not block by default (exit 0)
  # but is surfaced in gate-report.md and gate-decision.json.
  # Set to 0 to disable (default).
  # s1_pass_rate_warn: 100.0
  # overall_pass_rate_warn: 90.0

name: RQG Gate (External RAG + Notify)

on:
  pull_request:
  workflow_dispatch:

jobs:
  rqg-gate:
    uses: ./.github/workflows/rqg-reusable-gate.yml
    with:
      # Replace with your package source. If the caller repo vendors RQG itself,
      # use: python -m pip install -e .
      rqg_install_command: python -m pip install "git+https://github.com/OWNER/rag-quality-gate.git@TAG"
      cases_path: packs/hr/cases.csv
      run_pack_validation: true
      pack_validation_preset: external_notify
      pack_dir: packs/hr
      log_dir: runs/quality
      quality_pack_path: packs/hr/quality-pack.yml
      run_connection_validation: true
      run_dry_run_probe: true
      notification_kind: slack
      notify_on: warn,fail
    secrets:
      rag_api_endpoint: ${{ secrets.RAG_API_ENDPOINT }}
      rag_api_key: ${{ secrets.RAG_API_KEY }}
      notification_webhook_url: ${{ secrets.RQG_SLACK_WEBHOOK_URL }}

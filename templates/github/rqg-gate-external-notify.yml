name: RQG Gate (External RAG + Notify)

on:
  pull_request:
  workflow_dispatch:

jobs:
  rqg-gate:
    runs-on: ubuntu-latest
    env:
      RAG_API_ENDPOINT: ${{ secrets.RAG_API_ENDPOINT }}
      RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
      RQG_SLACK_WEBHOOK_URL: ${{ secrets.RQG_SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure RQG notifications
        run: |
          cat > .rqg.yml <<'YAML'
          notifications:
            - type: slack
              webhook_url_env: RQG_SLACK_WEBHOOK_URL
              notify_on: [warn, fail]
          thresholds:
            s1_pass_rate: 100.0
            overall_pass_rate: 80.0
          YAML

      - name: Install RQG
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate external RAG connection
        run: |
          rqg validate-connection \
            --endpoint "$RAG_API_ENDPOINT" \
            --api-key-env RAG_API_KEY \
            --query "healthcheck"

      - name: Run gate with notifications
        run: |
          rqg gate packs/hr/cases.csv \
            --log-dir runs/quality \
            --reset-log-dir \
            --rag-endpoint "$RAG_API_ENDPOINT" \
            --rag-api-key-env RAG_API_KEY \
            --quality-pack packs/hr/quality-pack.yml \
            --config .rqg.yml

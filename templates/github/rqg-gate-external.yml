name: RQG Gate (External RAG)

on:
  pull_request:
  workflow_dispatch:

jobs:
  rqg-gate:
    runs-on: ubuntu-latest
    env:
      RAG_API_ENDPOINT: ${{ secrets.RAG_API_ENDPOINT }}
      RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RQG
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate external RAG connection
        run: |
          rqg validate-connection \
            --endpoint "$RAG_API_ENDPOINT" \
            --api-key-env RAG_API_KEY \
            --query "healthcheck" \
            --output runs/quality/connection-validation.json

      - name: Run gate against external RAG
        run: |
          rqg gate packs/hr/cases.csv \
            --log-dir runs/quality \
            --reset-log-dir \
            --rag-endpoint "$RAG_API_ENDPOINT" \
            --rag-api-key-env RAG_API_KEY \
            --quality-pack packs/hr/quality-pack.yml
